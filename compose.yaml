services:
  postgres:
    image: 'postgres:18.6'
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
    ports:
      - '5432:5432'
  rabbitmq:
    image: 'rabbitmq:4.3.5-management'
    environment:
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
    ports:
      - '5672:5672'   # Porta principal de comunicação do Spring Boot (AMQP)
      - '15672:15672' # Porta do painel visual de gerenciamento no navegador
