spring.application.name=resource-system
spring.config.import=optional:file:./.env[.properties]


# Database Configuration (PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:mydatabase}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:myuser}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:secret}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Messaging Configuration (RabbitMQ)
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:${RABBITMQ_USER:myuser}}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:${RABBITMQ_PASSWORD:secret}}

# Google OAuth / OpenID Connect
resource.auth.google.enabled=${GOOGLE_LOGIN_ENABLED:false}
resource.auth.google.client-id=${GOOGLE_CLIENT_ID:}
resource.auth.google.client-secret=${GOOGLE_CLIENT_SECRET:}

# Password recovery: fill SMTP credentials and enable delivery in .env.
resource.auth.recovery.enabled=${MAIL_ENABLED:false}
resource.auth.recovery.from=${MAIL_FROM:nao-responda@example.com}
resource.auth.recovery.base-url=${APP_BASE_URL:http://localhost:8080}
resource.auth.recovery.token-ttl=30m
spring.mail.host=${MAIL_HOST:smtp.example.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:nao-responda@example.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Durable match events: publish after commit, retry delivery, and dead-letter failures.
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Bound broker work and keep background jobs independent.
spring.rabbitmq.connection-timeout=3s
spring.rabbitmq.requested-heartbeat=20s
spring.rabbitmq.listener.simple.concurrency=2
spring.rabbitmq.listener.simple.max-concurrency=4
spring.rabbitmq.listener.simple.prefetch=20
spring.task.scheduling.pool.size=2
spring.task.scheduling.thread-name-prefix=resource-scheduler-
resource.messaging.batch-size=50
resource.messaging.publish-delay-ms=1000

# Limits for contended workflow writes and database connection acquisition.
resource.match.lock-timeout-ms=3000
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.connection-timeout=5000

# Correlation and production-friendly logs (set LOG_FORMAT=ecs for JSON collection).
logging.level.root=INFO
logging.level.edu.br.resource.resourcesystem=${RESOURCE_LOG_LEVEL:INFO}
logging.pattern.level=%5p [requestId=%X{requestId:-none}]
logging.structured.format.console=${LOG_FORMAT:}
resource.logging.slow-request-ms=${SLOW_REQUEST_MS:1000}

# Institutional registration: external lookup and private, durable document storage.
resource.registration.brasil-api-url=${BRASIL_API_URL:https://brasilapi.com.br/api}
resource.registration.document-directory=${INSTITUTION_DOCUMENT_DIRECTORY:var/private/institution-documents}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=12MB

# Transactional notification e-mails share SMTP settings with password recovery.
resource.notifications.email-enabled=${NOTIFICATION_EMAIL_ENABLED:true}
resource.notifications.mail-delay-ms=5000
