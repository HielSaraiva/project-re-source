<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Envio da doação', ~{::pageStyles}, 'donor')}">
    <th:block th:fragment="pageStyles">
        <link rel="stylesheet" th:href="@{/css/donor/donation-flow.css}">
        <link rel="stylesheet" th:href="@{/css/donor/shipping.css}">
    </th:block>
</head>
<body>
<header th:replace="~{fragments/donor-header :: header('dashboard')}"></header>

<main class="main-content">
    <div class="header-area">
        <a class="back-link" th:href="@{/donor/dashboard}">
            <img th:src="@{/images/donor/shipping/arrow-left.svg}" alt=""> Voltar ao painel
        </a>
        <div class="titles">
            <h1>Como você prefere enviar sua doação?</h1>
            <p>Você está doando <strong th:text="${donation.item}">1x Monitor Dell 24"</strong> para o
                <strong th:text="${donation.organization}">Instituto Esperança</strong>. Escolha o método de entrega.</p>
        </div>
    </div>

    <section class="options-cards" aria-label="Métodos de entrega">
        <article class="delivery-card" th:each="option : ${ {inPerson, mail} }">
            <div class="card-content-top">
                <div class="badge-icon-header">
                    <div class="icon-frame">
                        <img th:src="@{/images/donor/shipping/{icon}(icon=${option.icon})}" alt="">
                    </div>
                    <span class="option-badge"
                          th:classappend="${option == mail ? ' option-badge--shipping' : ''}"
                          th:text="${option.badge}">Entrega Direta</span>
                </div>
                <div class="title-block">
                    <h2 th:text="${option.title}">Entrega Presencial</h2>
                    <p th:text="${option.description}">Leve a doação diretamente ao local da instituição.</p>
                </div>
                <img class="section-divider" th:src="@{/images/donor/shipping/line.svg}" alt="">
                <div th:replace="~{fragments/donation :: details(${option.details}, '/images/donor/shipping', '', '')}"></div>
            </div>
            <div class="card-action-wrapper">
                <a class="action-button"
                   th:classappend="${option == inPerson ? ' action-button--outline' : ''}"
                   href="#confirmation" th:text="${option.action}">Confirmar Entrega Presencial</a>
            </div>
        </article>
    </section>

    <aside th:replace="~{fragments/donation :: impactBanner('/images/donor/shipping')}"></aside>
</main>
</body>
</html>
