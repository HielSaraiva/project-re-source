<div xmlns:th="http://www.thymeleaf.org" th:fragment="passwordField(id, label, autocomplete, registration)" class="proposal-field auth-field">
    <label th:for="${id}" th:text="${label}">Senha</label>
    <div class="auth-input">
        <svg th:replace="~{fragments/auth/icon :: icon('lock')}"></svg>
        <input th:id="${id}" th:name="${id}" type="password" placeholder="••••••••" th:autocomplete="${autocomplete}" required
            th:pattern="${registration and id == 'password' ? passwordPattern : null}"
            th:attr="data-password-max-bytes=${registration ? passwordMaxBytes : null},data-password-byte-limit-message=${registration ? passwordByteLimitMessage : null},minlength=${registration ? passwordMinLength : null},maxlength=${registration ? passwordMaxBytes : null},aria-invalid=${registration and #fields.hasErrors(id) ? 'true' : null},aria-describedby=${registration ? (id == 'password' ? 'password-help ' : '') + id + '-error' : null}">
        <button class="auth-password-toggle" type="button" th:attr="aria-label=${'Mostrar ' + #strings.toLowerCase(label)},aria-controls=${id}" aria-pressed="false" hidden><span class="auth-password-icon" aria-hidden="true"><svg th:replace="~{fragments/auth/icon :: icon('eye')}"></svg><span class="auth-password-slash"></span></span></button>
    </div>
    <small th:if="${registration and id == 'password'}" id="password-help" class="auth-help" th:text="${passwordPolicyMessage}">Informe uma senha que atenda aos requisitos.</small>
    <small th:if="${registration}" th:id="${id + '-error'}" class="auth-field-error"><span th:if="${#fields.hasErrors(id)}" th:each="error : ${#fields.errors(id)}" th:text="${error}">Confira este campo.</span></small>
</div>
