<div
    xmlns:th="http://www.thymeleaf.org"
    th:fragment="passwordField(id, label, autocomplete, registration)"
    class="proposal-field auth-field"
>
    <label th:for="${id}" th:text="${label}">Senha</label>
    <div class="auth-input">
        <svg th:replace="~{fragments/auth/icon :: icon('lock')}"></svg>
        <input
            th:id="${id}"
            th:name="${id}"
            type="password"
            placeholder="••••••••"
            th:autocomplete="${autocomplete}"
            autocapitalize="none"
            spellcheck="false"
            autocorrect="off"
            th:enterkeyhint="${registration and id == 'password' ? 'next' : 'done'}"
            required
            th:pattern="${registration and id == 'password' ? passwordPattern : null}"
            th:attr="data-password-max-bytes=${registration ? passwordMaxBytes : null},data-password-policy-message=${registration ? passwordPolicyMessage : null},data-password-byte-limit-message=${registration ? passwordByteLimitMessage : null},minlength=${registration ? passwordMinLength : null},maxlength=${registration ? passwordMaxLength : null},aria-invalid=${registration and #fields.hasErrors(id) ? 'true' : null},aria-describedby=${registration ? (id == 'password' ? 'password-help password-requirements password-status ' : 'password-confirmation-status ') + id + '-error' : null}"
        />
        <button
            class="auth-password-toggle"
            type="button"
            th:attr="aria-label=${'Mostrar ' + #strings.toLowerCase(label)},aria-controls=${id}"
            aria-pressed="false"
            hidden
            ><span class="auth-password-icon" aria-hidden="true"
                ><svg th:replace="~{fragments/auth/icon :: icon('eye')}"></svg
                ><span class="auth-password-slash"></span></span
        ></button>
    </div>
    <th:block th:if="${registration and id == 'password'}">
        <div th:replace="~{fragments/auth/password-requirements :: requirements}"></div>
    </th:block>
    <small
        th:if="${registration and id == 'passwordConfirmation'}"
        id="password-confirmation-status"
        class="auth-help auth-password-status"
        data-password-confirmation-status
    ></small>
    <small th:if="${registration}" th:id="${id + '-error'}" class="auth-field-error"
        ><span
            th:if="${#fields.hasErrors(id)}"
            th:each="error : ${#fields.errors(id)}"
            th:text="${error}"
            >Confira este campo.</span
        ></small
    >
</div>
