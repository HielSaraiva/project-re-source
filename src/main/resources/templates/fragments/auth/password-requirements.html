<div
    xmlns:th="http://www.thymeleaf.org"
    th:fragment="requirements"
    class="auth-password-feedback"
    data-password-feedback
>
    <small id="password-help" class="auth-help"
        >Use uma senha exclusiva. Você pode preencher com um gerenciador de senhas.</small
    >
    <ul
        id="password-requirements"
        class="auth-password-requirements"
        aria-label="Requisitos da senha"
    >
        <li data-password-length>
            <span class="auth-password-check" aria-hidden="true"
                ><svg th:replace="~{fragments/auth/icon :: icon('check')}"></svg
            ></span>
            <span th:text="${'De ' + passwordMinLength + ' a ' + passwordMaxLength + ' caracteres'}"
                >De 8 a 12 caracteres</span
            >
            <span class="auth-password-state" data-password-state></span>
        </li>
        <li
            th:each="requirement : ${passwordRequirements}"
            th:attr="data-password-pattern=${requirement.pattern}"
        >
            <span class="auth-password-check" aria-hidden="true"
                ><svg th:replace="~{fragments/auth/icon :: icon('check')}"></svg
            ></span>
            <span th:text="${requirement.label}"></span>
            <span class="auth-password-state" data-password-state></span>
        </li>
    </ul>
    <small
        id="password-status"
        class="auth-help auth-password-status"
        role="status"
        aria-live="polite"
        aria-atomic="true"
        hidden
    ></small>
</div>
