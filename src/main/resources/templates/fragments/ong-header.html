<header class="navbar" th:fragment="header(activePage)">
    <a th:replace="~{fragments/header-components :: brand('/ong/dashboard', 'ReSource - painel da ONG')}"></a>
    <button th:replace="~{fragments/navigation-toggle :: toggle}"></button>
    <div class="navigation-panel">
        <div class="navigation-panel__content">
            <nav id="primary-navigation" class="nav-links" aria-label="Navegação da ONG">
                <a class="nav-link" th:classappend="${activePage == 'dashboard' ? ' nav-link--active' : ''}"
                   th:href="@{/ong/dashboard}">Painel</a>
                <a class="nav-link" th:classappend="${activePage == 'needs' ? ' nav-link--active' : ''}"
                   th:href="@{/ong/needs}">Minhas Necessidades</a>
                <a class="nav-link" href="#logistics">Perfil Logístico</a>
            </nav>
        </div>
    </div>
    <div th:replace="~{fragments/header-components :: actions(${ongName}, ${ongRole}, 'Abrir menu da ONG')}"></div>
</header>
