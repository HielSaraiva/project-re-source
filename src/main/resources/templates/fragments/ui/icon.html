<svg xmlns="http://www.w3.org/2000/svg" xmlns:th="http://www.thymeleaf.org" th:fragment="icon(name)" class="ui-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
    <th:block th:fragment="paths(name)" th:switch="${name}">
        <g th:case="'mail'"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></g>
        <g th:case="'building'"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 21v-4h6v4M8 7h1m6 0h1M8 11h1m6 0h1"/></g>
        <g th:case="'user'"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></g>
        <g th:case="'identity'"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8" cy="10" r="2"/><path d="M5 16a3 3 0 0 1 6 0m3-6h4m-4 4h4"/></g>
        <g th:case="'lock'"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></g>
        <g th:case="'eye'"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></g>
        <g th:case="'search'"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></g>
        <g th:case="'upload'"><path d="M7 17H6a4 4 0 0 1-.8-7.9 7 7 0 0 1 13.5-1A4.5 4.5 0 0 1 18 17h-1M12 21V12m-4 4 4-4 4 4"/></g>
        <g th:case="'arrow-up-right'"><path d="M7 17 17 7M7 7h10v10"/></g>
        <g th:case="'arrow-down'"><path d="M12 5v14m-7-7 7 7 7-7"/></g>
        <g th:case="'pencil'"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></g>
        <g th:case="'trash'"><path d="M3 6h18M8 6V4h8v2m-9 0 1 14h8l1-14M10 11v5m4-5v5"/></g>
        <g th:case="'plus'"><path d="M12 5v14m-7-7h14"/></g>
        <g th:case="'check'"><path d="m5 12 4 4L19 6"/></g>
        <use width="24" height="24" th:case="'clothing'" th:href="@{/images/shared/categories/clothing.svg#icon}"/>
        <use width="24" height="24" th:case="'education'" th:href="@{/images/shared/categories/education.svg#icon}"/>
        <use width="24" height="24" th:case="'toy'" th:href="@{/images/shared/categories/toy.svg#icon}"/>
        <use width="24" height="24" th:case="'household'" th:href="@{/images/shared/categories/household.svg#icon}"/>
        <use width="24" height="24" th:case="'package'" th:href="@{/images/shared/categories/package.svg#icon}"/>
        <use width="24" height="24" th:case="'file-text'" th:href="@{/images/shared/icons/file-text.svg#icon}" stroke-width="1.5"/>
        <use width="24" height="24" th:case="'shield'" th:href="@{/images/donor/needs/shield.svg#icon}" stroke-width="1.1666667"/>
        <use width="24" height="24" th:case="'check-circle'" th:href="@{/images/donor/donation-completed/check-circle.svg#icon}" stroke-width="1.5"/>
        <use width="24" height="24" th:case="'bell'" th:href="@{/images/shared/notification.svg#icon}"/>
    </th:block>
</svg>
