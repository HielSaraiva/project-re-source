<head xmlns:th="http://www.thymeleaf.org" th:fragment="head(title, pageStyles, persona)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" th:href="@{/images/shared/leaf.svg}">
    <title th:text="${'ReSource | ' + title}">ReSource</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link th:href="${'https://fonts.googleapis.com/css2?family=Inter:wght@' + (persona == 'ong' ? '400;500;600;700;800' : '400;500;600;700') + '&family=Outfit:wght@700;800&display=swap'}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/shared/base.css}">
    <link rel="stylesheet" th:href="@{/css/shared/header.css}">
    <link rel="stylesheet" th:if="${persona == 'ong'}" th:href="@{/css/ong/header.css}">
    <script th:src="@{/js/mock-storage.js}"></script>
    <script th:if="${persona == 'donor'}" th:src="@{/js/donation-deadlines.js}"></script>
    <th:block th:replace="${pageStyles}"></th:block>
    <link rel="stylesheet" th:href="@{/css/shared/mobile-navigation.css}">
    <script th:src="@{/js/navigation.js}"></script>
</head>
