<head xmlns:th="http://www.thymeleaf.org" th:fragment="head(title, pageStyles, persona)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <meta name="context-path" th:content="@{/}">
    <script th:src="@{/js/loading-feedback.js}" defer></script>
    <script th:src="@{/js/resource-http.js}" defer></script>
    <script th:src="@{/js/backend-flow.js}" defer></script>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/shared/leaf.svg}">
    <title th:text="${'ReSource | ' + title}">ReSource</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link th:href="${'https://fonts.googleapis.com/css2?family=Inter:wght@' + (persona == 'ong' ? '400;500;600;700;800' : '400;500;600;700') + '&family=Outfit:wght@700;800&display=swap'}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/shared/base.css}">
    <link rel="stylesheet" th:href="@{/css/shared/loading-feedback.css}">
    <link rel="stylesheet" th:href="@{/css/shared/donation-status.css}">
    <link rel="stylesheet" th:href="@{/css/shared/icon-frame.css}">
    <link rel="stylesheet" th:href="@{/css/shared/form-fields.css}">
    <link rel="stylesheet" th:href="@{/css/shared/header.css}">
    <link rel="stylesheet" th:if="${persona == 'ong'}" th:href="@{/css/ong/header.css}">
    <th:block th:replace="${pageStyles}"></th:block>
    <link rel="stylesheet" th:href="@{/css/shared/typography.css}">
    <link rel="stylesheet" th:href="@{/css/shared/donation-protocol.css}">
    <link rel="stylesheet" th:href="@{/css/shared/mobile-navigation.css}">
    <link rel="stylesheet" th:href="@{/css/shared/buttons.css}">
    <link rel="stylesheet" th:href="@{/css/shared/notifications.css}">
    <script th:src="@{/js/notifications.js}" defer></script>
    <script th:src="@{/js/navigation.js}"></script>
</head>
