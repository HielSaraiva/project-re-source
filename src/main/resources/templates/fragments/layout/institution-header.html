<header class="navbar" th:fragment="header(activePage)">
    <a
        th:replace="~{fragments/layout/header-components :: brand('/institution/dashboard', 'ReSource - painel da ONG')}"
    ></a>
    <button th:replace="~{fragments/layout/navigation-toggle :: toggle}"></button>
    <div class="navigation-panel">
        <div class="navigation-panel__content">
            <nav id="primary-navigation" class="nav-links" aria-label="Navegação da ONG">
                <a
                    class="nav-link"
                    th:classappend="${activePage == 'dashboard' ? ' nav-link--active' : ''}"
                    th:href="@{/institution/dashboard}"
                    >Painel</a
                >
                <a
                    class="nav-link"
                    th:classappend="${activePage == 'donations' ? ' nav-link--active' : ''}"
                    th:href="@{/institution/donations}"
                    >Gestão de doações</a
                >
                <a
                    class="nav-link"
                    th:classappend="${activePage == 'needs' ? ' nav-link--active' : ''}"
                    th:href="@{/institution/necessities}"
                    >Minhas necessidades</a
                >
            </nav>
        </div>
    </div>
    <div
        th:replace="~{fragments/layout/header-components :: actions(${ongName}, ${ongRole}, 'Abrir menu da ONG')}"
    ></div>
</header>
