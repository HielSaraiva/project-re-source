<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/auth/layout :: page('Redefinir senha', true, '', ~{::content})}">
    <body>
        <section th:fragment="content" class="auth-panel" aria-labelledby="reset-title">
            <div class="auth-card">
                <header class="auth-heading"><h1 id="reset-title" th:text="${validToken ? 'Crie sua nova senha' : 'Este link não está disponível'}">Crie sua nova senha</h1><p th:text="${validToken ? 'Escolha uma senha segura para voltar a acessar sua conta.' : 'O link é inválido, expirou ou já foi utilizado. Solicite um novo para continuar.'}"></p></header>
                <div class="auth-content">
                    <form th:if="${validToken}" class="auth-form" th:object="${reset}" th:action="@{/password/reset}" method="post">
                        <input type="hidden" th:field="*{token}">
                        <div th:replace="~{fragments/auth/password-field :: passwordField('password', 'Nova senha', 'new-password', true)}"></div>
                        <div th:replace="~{fragments/auth/password-field :: passwordField('passwordConfirmation', 'Confirme a nova senha', 'new-password', true)}"></div>
                        <button class="button auth-submit" type="submit">Salvar nova senha</button>
                    </form>
                    <a th:unless="${validToken}" class="button auth-submit" th:href="@{/password/forgot}">Solicitar novo link</a>
                    <footer class="auth-footer"><a class="text-link" th:href="@{/login}">← Voltar ao login</a></footer>
                </div>
            </div>
        </section>
    </body>
</html>
