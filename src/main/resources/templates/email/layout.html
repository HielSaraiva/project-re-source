<!DOCTYPE html>
<html
    lang="pt-BR"
    xmlns:th="http://www.thymeleaf.org"
    th:fragment="message(pageTitle, preview, content)"
>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="color-scheme" content="light" />
        <meta name="supported-color-schemes" content="light" />
        <title th:text="${pageTitle}">ReSource</title>
        <style>
            body,
            table,
            td,
            a {
                -webkit-text-size-adjust: 100%;
                -ms-text-size-adjust: 100%;
            }
            table,
            td {
                mso-table-lspace: 0pt;
                mso-table-rspace: 0pt;
            }
            a:focus-visible {
                outline: 2px solid #047857;
                outline-offset: 4px;
            }
            @media only screen and (max-width: 600px) {
                .email-wrapper {
                    padding: 16px 12px !important;
                }
                .email-header {
                    padding: 14px 20px !important;
                }
                .email-content {
                    padding: 24px 20px !important;
                }
                .email-footer {
                    padding: 18px 20px !important;
                }
                .email-title {
                    font-size: 24px !important;
                    line-height: 31px !important;
                }
                .email-action {
                    width: 100% !important;
                }
                .email-button {
                    display: block !important;
                    padding: 14px 16px !important;
                    text-align: center !important;
                }
            }
        </style>
    </head>
    <body
        style="
            margin: 0;
            padding: 0;
            background: #f1f5f9;
            color: #0f172a;
            font-family: Arial, Helvetica, sans-serif;
        "
    >
        <div
            th:text="${preview}"
            style="
                display: none;
                font-size: 1px;
                line-height: 1px;
                max-height: 0;
                max-width: 0;
                opacity: 0;
                overflow: hidden;
                mso-hide: all;
            "
        ></div>
        <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="background: #f1f5f9; table-layout: fixed"
        >
            <tr>
                <td class="email-wrapper" align="center" style="padding: 28px 16px">
                    <!--[if mso]><table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
                    <table
                        role="presentation"
                        width="100%"
                        cellpadding="0"
                        cellspacing="0"
                        border="0"
                        style="
                            table-layout: fixed;
                            max-width: 560px;
                            border: 1px solid #e2e8f0;
                            border-radius: 16px;
                            background: #ffffff;
                        "
                    >
                        <tr th:replace="~{email/brand :: header}"></tr>
                        <tr>
                            <td
                                class="email-content"
                                style="
                                    padding: 28px;
                                    overflow-wrap: anywhere;
                                    word-break: break-word;
                                "
                            >
                                <p
                                    style="
                                        margin: 0 0 12px;
                                        font-size: 15px;
                                        line-height: 24px;
                                        color: #475569;
                                    "
                                    >Olá,
                                    <strong th:text="${name}" style="color: #0f172a">Maria</strong
                                    >.</p
                                >
                                <th:block
                                    th:replace="${content}"
                                ></th:block>
                            </td>
                        </tr>
                        <tr th:replace="~{email/brand :: footer}"></tr>
                    </table>
                    <!--[if mso]></td></tr></table><![endif]-->
                </td>
            </tr>
        </table>
    </body>
</html>
