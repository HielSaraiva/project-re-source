<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:fragment="message(pageTitle, preview, content)">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title th:text="${pageTitle}">ReSource</title>
    </head>
    <body style="margin:0;padding:0;background:#f8fafc;color:#0f172a;font-family:Arial,Helvetica,sans-serif;">
        <div th:text="${preview}" style="display:none;max-height:0;overflow:hidden;"></div>
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f8fafc;">
            <tr>
                <td align="center" style="padding:32px 16px;">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;border:1px solid #e2e8f0;border-radius:16px;background:#ffffff;">
                        <tr th:replace="~{email/brand :: header}"></tr>
                        <tr>
                            <td style="padding:32px;">
                                <p style="margin:0 0 16px;font-size:15px;line-height:1.6;">Olá, <strong th:text="${name}">Maria</strong>.</p>
                                <th:block th:replace="${content}"></th:block>
                            </td>
                        </tr>
                        <tr th:replace="~{email/brand :: footer}"></tr>
                    </table>
                </td>
            </tr>
        </table>
    </body>
</html>
