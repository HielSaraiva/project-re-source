<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <body>
        <table role="presentation">
            <tr th:fragment="header">
                <td
                    class="email-header"
                    bgcolor="#10b981"
                    style="padding: 16px 28px; background: #10b981; border-radius: 16px 16px 0 0"
                >
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                        <tr>
                            <td width="32" style="vertical-align: middle"
                                ><img
                                    src="cid:resource-logo"
                                    alt=""
                                    width="32"
                                    height="32"
                                    style="display: block; border: 0; width: 32px; height: 32px"
                            /></td>
                            <td
                                style="
                                    padding-left: 10px;
                                    vertical-align: middle;
                                    font-family: Arial, Helvetica, sans-serif;
                                    font-size: 24px;
                                    line-height: 32px;
                                    font-weight: 700;
                                    letter-spacing: -0.8px;
                                    color: #ffffff;
                                "
                                >ReSource</td
                            >
                        </tr>
                    </table>
                </td>
            </tr>
            <tr th:fragment="footer">
                <td
                    class="email-footer"
                    style="
                        padding: 20px 28px;
                        border-top: 1px solid #e2e8f0;
                        background: #f8fafc;
                        border-radius: 0 0 16px 16px;
                    "
                >
                    <p
                        style="
                            margin: 0 0 6px;
                            font-size: 13px;
                            line-height: 20px;
                            font-weight: 700;
                            color: #475569;
                        "
                        >Recursos que conectam pessoas.</p
                    >
                    <p style="margin: 0; font-size: 12px; line-height: 19px; color: #64748b"
                        >Mensagem automática do ReSource. Acompanhe as informações da sua conta pelo
                        site.</p
                    >
                </td>
            </tr>
        </table>
    </body>
</html>
