<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <body>
        <table
            th:fragment="button(url, label)"
            class="email-action"
            role="presentation"
            cellpadding="0"
            cellspacing="0"
            border="0"
        >
            <tr>
                <td
                    align="center"
                    bgcolor="#10b981"
                    style="border-radius: 8px; background: #10b981; mso-padding-alt: 14px 22px"
                >
                    <a
                        class="email-button"
                        th:href="${url}"
                        th:text="${label}"
                        style="
                            display: inline-block;
                            padding: 14px 22px;
                            border: 1px solid #10b981;
                            border-radius: 8px;
                            color: #ffffff;
                            font-family: Arial, Helvetica, sans-serif;
                            font-size: 16px;
                            line-height: 22px;
                            font-weight: 700;
                            text-decoration: none;
                        "
                    ></a>
                </td>
            </tr>
        </table>
        <table
            th:fragment="fallback(url)"
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="table-layout: fixed; margin-top: 24px; border-top: 1px solid #e2e8f0"
        >
            <tr>
                <td style="padding-top: 18px">
                    <p style="margin: 0 0 8px; font-size: 13px; line-height: 20px; color: #64748b"
                        >Não conseguiu abrir o botão? Copie e cole este link no navegador:</p
                    >
                    <a
                        th:href="${url}"
                        th:text="${url}"
                        style="
                            font-size: 13px;
                            line-height: 21px;
                            color: #047857;
                            text-decoration: underline;
                            word-break: break-all;
                            overflow-wrap: anywhere;
                        "
                    ></a>
                </td>
            </tr>
        </table>
    </body>
</html>
