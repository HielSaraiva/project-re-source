<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Atualização da sua doação</title></head>
<body style="margin:0;padding:0;background:#f8fafc;color:#0f172a;font-family:Arial,Helvetica,sans-serif;">
<div style="display:none;max-height:0;overflow:hidden;">Há uma atualização sobre sua doação no ReSource.</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f8fafc;"><tr><td align="center" style="padding:32px 16px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;border:1px solid #e2e8f0;border-radius:16px;background:#ffffff;">
        <tr th:replace="~{email/brand :: header}"></tr>
        <tr><td style="padding:32px;">
            <p style="margin:0 0 16px;font-size:15px;line-height:1.6;">Olá, <strong th:text="${name}">Maria</strong>.</p>
            <h1 th:text="${title}" style="margin:0 0 16px;font-size:26px;line-height:1.3;letter-spacing:-0.5px;">Atualização da doação</h1>
            <p th:text="${message}" style="margin:0 0 24px;font-size:15px;line-height:1.7;color:#475569;">Acompanhe sua doação.</p>
            <table role="presentation" cellpadding="0" cellspacing="0"><tr><td bgcolor="#10b981" style="border-radius:8px;"><a th:href="${targetUrl}" style="display:inline-block;padding:15px 24px;border:1px solid #10b981;border-radius:8px;color:#ffffff;font-size:15px;font-weight:700;text-decoration:none;">Acompanhar doação</a></td></tr></table>
            <p style="margin:24px 0 8px;font-size:12px;line-height:1.6;color:#64748b;">Se o botão não funcionar, copie este endereço para o navegador:</p>
            <a th:href="${targetUrl}" th:text="${targetUrl}" style="font-size:12px;line-height:1.7;color:#047857;word-break:break-all;overflow-wrap:anywhere;"></a>
        </td></tr>
        <tr th:replace="~{email/brand :: footer}"></tr>
    </table>
</td></tr></table>
</body>
</html>
