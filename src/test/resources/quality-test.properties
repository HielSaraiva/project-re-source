# Isolated test configuration. Never imports .env or production endpoints.
spring.application.name=resource-quality
spring.docker.compose.enabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.datasource.hikari.maximum-pool-size=12
spring.mail.host=127.0.0.1
spring.mail.port=1
spring.mail.username=fake
spring.mail.password=fake
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
resource.auth.recovery.enabled=true
resource.auth.recovery.from=no-reply@example.test
resource.auth.recovery.base-url=http://127.0.0.1:8080
resource.auth.recovery.token-ttl=30m
resource.privacy.contact-email=privacy@example.test
resource.auth.google.enabled=false
resource.notifications.email-enabled=true
resource.messaging.batch-size=20
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.auto-startup=false
resource.match.lock-timeout-ms=3000
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=12MB
logging.level.root=WARN
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
management.endpoints.web.exposure.include=health

management.health.mail.enabled=false
