name: Testes Automatizados

on:
  pull_request:
    branches: 
      - develop
      - main

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Tornar mvnw executável
        run: chmod +x ./mvnw

      - name: Executar testes (Unitários, Integração e Cobertura)
        run: ./mvnw verify -B